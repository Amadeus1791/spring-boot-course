spring:
  application:
    name: event-booking
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks at startup that the entities match it.
      ddl-auto: validate
    open-in-view: false
  datasource:
    # H2 in memory. MODE=PostgreSQL, DATABASE_TO_LOWER and DEFAULT_NULL_ORDERING make H2 behave like PostgreSQL.
    url: jdbc:h2:mem:eventbooking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
logging:
  pattern:
    # Every log line shows the request id from the MDC (RequestIdFilter).
    correlation: "[%X{requestId:-}] "
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always
      show-details: when-authorized
